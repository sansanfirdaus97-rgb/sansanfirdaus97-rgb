<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0b1023"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="2" fill="url(#line)" filter="url(#glow)"/>

  <text x="48" y="68" font-family="monospace" font-size="15" letter-spacing="3" fill="#67e8f9">
    CLINICAL.SYSTEM / DIRECTION
  </text>
  <text x="48" y="96" font-family="monospace" font-size="13" fill="#64748b">
    context should accumulate — clinical authority remains human
  </text>

  <line x1="115" y1="175" x2="1085" y2="175" stroke="url(#line)" stroke-width="2" opacity="0.7"/>

  <g font-family="monospace" text-anchor="middle">
    <g>
      <circle cx="115" cy="175" r="24" fill="#07111f" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="115" cy="175" r="5" fill="#22d3ee" filter="url(#glow)"/>
      <text x="115" y="225" font-size="14" fill="#e2e8f0">Clinical Record</text>
      <text x="115" y="246" font-size="11" fill="#64748b">capture</text>
    </g>

    <g>
      <circle cx="310" cy="175" r="24" fill="#07111f" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="310" cy="175" r="5" fill="#38bdf8" filter="url(#glow)"/>
      <text x="310" y="225" font-size="14" fill="#e2e8f0">Clinical Memory</text>
      <text x="310" y="246" font-size="11" fill="#64748b">preserve</text>
    </g>

    <g>
      <circle cx="505" cy="175" r="24" fill="#07111f" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="505" cy="175" r="5" fill="#60a5fa" filter="url(#glow)"/>
      <text x="505" y="225" font-size="14" fill="#e2e8f0">Clinical Context</text>
      <text x="505" y="246" font-size="11" fill="#64748b">surface</text>
    </g>

    <g>
      <circle cx="700" cy="175" r="24" fill="#07111f" stroke="#818cf8" stroke-width="2"/>
      <circle cx="700" cy="175" r="5" fill="#818cf8" filter="url(#glow)"/>
      <text x="700" y="225" font-size="14" fill="#e2e8f0">Clinical Decision</text>
      <text x="700" y="246" font-size="11" fill="#64748b">veterinarian</text>
    </g>

    <g>
      <circle cx="895" cy="175" r="24" fill="#07111f" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="895" cy="175" r="5" fill="#a78bfa" filter="url(#glow)"/>
      <text x="895" y="225" font-size="14" fill="#e2e8f0">Clinical Knowledge</text>
      <text x="895" y="246" font-size="11" fill="#64748b">describe</text>
    </g>

    <g>
      <circle cx="1085" cy="175" r="28" fill="#07111f" stroke="#d946ef" stroke-width="2" filter="url(#glow)"/>
      <circle cx="1085" cy="175" r="6" fill="#d946ef"/>
      <text x="1085" y="225" font-size="14" fill="#f8fafc">Clinical OS</text>
      <text x="1085" y="246" font-size="11" fill="#a78bfa">direction</text>
    </g>
  </g>

  <text x="48" y="282" font-family="monospace" font-size="11" letter-spacing="2" fill="#475569">
    VETLIFT · CLINICAL CONTINUITY ELEVATED.
  </text>
</svg>
