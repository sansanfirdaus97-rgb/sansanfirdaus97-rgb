    <g><circle cx="502" cy="180" r="24" fill="#07111f" stroke="#60a5fa" stroke-width="2"/><circle cx="502" cy="180" r="5" fill="#60a5fa"/>
      <text x="502" y="232" font-size="14" fill="#e2e8f0">Clinical Context</text><text x="502" y="253" font-size="11" fill="#64748b">surface</text></g>
    <g><circle cx="698" cy="180" r="24" fill="#07111f" stroke="#818cf8" stroke-width="2"/><circle cx="698" cy="180" r="5" fill="#818cf8"/>
