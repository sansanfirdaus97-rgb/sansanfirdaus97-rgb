<svg width="1200" height="270" viewBox="0 0 1200 270" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0b1023"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="270" rx="24" fill="url(#bg)"/>
  <text x="600" y="76" text-anchor="middle" font-family="monospace" font-size="16" letter-spacing="5" fill="#67e8f9">VETLIFT</text>
  <text x="600" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Clinical Continuity Elevated.</text>
  <text x="600" y="165" text-anchor="middle" font-family="monospace" font-size="13" fill="#94a3b8">Clinical Record → Clinical Memory → Clinical Context → Clinical Decision → Clinical Knowledge → Clinical OS</text>
  <rect x="280" y="204" width="640" height="2" fill="url(#accent)"/>
  <circle cx="600" cy="205" r="5" fill="#22d3ee">
    <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="242" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="3" fill="#475569">CLICK TO OPEN VETLIFT.APP · SYSTEM ONLINE</text>
</svg>