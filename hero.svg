<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0b1023"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BASE -->
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>

  <!-- GRID -->
  <g opacity="0.07" stroke="#67e8f9">
    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 300H1200"/>

    <path d="M100 0V360"/>
    <path d="M200 0V360"/>
    <path d="M300 0V360"/>
    <path d="M400 0V360"/>
    <path d="M500 0V360"/>
    <path d="M600 0V360"/>
    <path d="M700 0V360"/>
    <path d="M800 0V360"/>
    <path d="M900 0V360"/>
    <path d="M1000 0V360"/>
    <path d="M1100 0V360"/>
  </g>

  <!-- TOP ACCENT -->
  <rect x="38" y="34" width="1124" height="2"
        fill="url(#accent)"
        filter="url(#glow)"/>

  <!-- LABEL -->
  <text x="52" y="72"
        font-family="monospace"
        font-size="15"
        letter-spacing="4"
        fill="#67e8f9">
    VETLIFT / FOUNDER CONSOLE
  </text>

  <!-- ONLINE -->
  <circle cx="1072" cy="66" r="5"
          fill="#22d3ee"
          filter="url(#glow)"/>

  <text x="1088" y="72"
        font-family="monospace"
        font-size="13"
        fill="#94a3b8">
    ONLINE
  </text>

  <!-- NAME -->
  <text x="52" y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-size="50"
        font-weight="700"
        fill="#f8fafc">
    IHSANUL FIRDAUS
  </text>

  <text x="54" y="180"
        font-family="monospace"
        font-size="17"
        fill="#c4b5fd">
    VETERINARIAN · FOUNDER · PRODUCT ARCHITECT
  </text>

  <text x="54" y="215"
        font-family="monospace"
        font-size="14"
        fill="#64748b">
    Building clinical systems from active veterinary practice.
  </text>

  <!-- SYSTEM PANEL -->
  <rect x="675" y="105" width="470" height="160"
        rx="14"
        fill="#07111f"
        stroke="#164e63"/>

  <text x="700" y="137"
        font-family="monospace"
        font-size="14"
        fill="#22d3ee">
    SYSTEM.INFO
  </text>

  <text x="700" y="170"
        font-family="monospace"
        font-size="14"
        fill="#94a3b8">
    DOMAIN ......... Veterinary Medicine
  </text>

  <text x="700" y="198"
        font-family="monospace"
        font-size="14"
        fill="#94a3b8">
    PLATFORM ....... VetLift
  </text>

  <text x="700" y="226"
        font-family="monospace"
        font-size="14"
        fill="#94a3b8">
    FOCUS .......... Clinical Continuity
  </text>

  <text x="700" y="254"
        font-family="monospace"
        font-size="14"
        fill="#94a3b8">
    RUNTIME ........ vetlift.app
  </text>

  <!-- BOTTOM -->
  <text x="52" y="314"
        font-family="monospace"
        font-size="13"
        letter-spacing="3"
        fill="#64748b">
    CLINICAL CONTINUITY ELEVATED.
  </text>

  <rect x="52" y="331" width="1093" height="2"
        fill="url(#accent)"
        opacity="0.8"/>

</svg>
