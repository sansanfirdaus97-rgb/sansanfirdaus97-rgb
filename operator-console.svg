<svg width="1200" height="490" viewBox="0 0 1200 490" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0b1023"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="490" rx="24" fill="url(#bg)"/>
  <rect x="38" y="32" width="1124" height="2" fill="url(#accent)" filter="url(#glow)"/>
  <text x="52" y="70" font-family="monospace" font-size="15" letter-spacing="3" fill="#67e8f9">OPERATOR / SYSTEM.INFO</text>
  <text x="52" y="97" font-family="monospace" font-size="12" fill="#64748b">identity · mission · authority</text>

  <rect x="52" y="126" width="280" height="305" rx="16" fill="#07111f" stroke="#164e63"/>
  <text x="78" y="170" font-family="monospace" font-size="13" fill="#22d3ee">OPERATOR</text>
  <text x="78" y="214" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Ihsanul Firdaus</text>
  <text x="78" y="250" font-family="monospace" font-size="14" fill="#cbd5e1">Veterinarian</text>
  <text x="78" y="280" font-family="monospace" font-size="14" fill="#cbd5e1">Founder</text>
  <text x="78" y="310" font-family="monospace" font-size="14" fill="#cbd5e1">Product Architect</text>
  <rect x="78" y="348" width="150" height="30" rx="8" fill="#0b1728" stroke="#1e293b"/>
  <text x="153" y="368" text-anchor="middle" font-family="monospace" font-size="12" fill="#a5f3fc">ACTIVE CLINICIAN</text>

  <rect x="365" y="126" width="783" height="305" rx="16" fill="#07111f" stroke="#312e81"/>
  <text x="392" y="165" font-family="monospace" font-size="13" fill="#a5b4fc">SYSTEM.INFO</text>
  <text x="392" y="198" font-family="monospace" font-size="13" fill="#94a3b8">DOMAIN ........ Veterinary Medicine</text>
  <text x="392" y="226" font-family="monospace" font-size="13" fill="#94a3b8">PLATFORM ...... VetLift</text>
  <text x="392" y="254" font-family="monospace" font-size="13" fill="#94a3b8">FOCUS ......... Clinical Continuity</text>
  <text x="392" y="282" font-family="monospace" font-size="13" fill="#94a3b8">MODE .......... Active Development</text>
  <text x="392" y="310" font-family="monospace" font-size="13" fill="#94a3b8">RUNTIME ....... vetlift.app</text>

  <text x="760" y="165" font-family="monospace" font-size="13" fill="#22d3ee">MISSION</text>
  <text x="760" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">Building a clinical-first veterinary platform</text>
  <text x="760" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">around a simple principle:</text>

  <rect x="760" y="248" width="348" height="66" rx="10" fill="#081526" stroke="#1e293b"/>
  <text x="779" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">The patient may return, but the clinical</text>
  <text x="779" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">context should never start from zero.</text>

  <text x="760" y="350" font-family="monospace" font-size="13" fill="#d946ef">AUTHORITY.RULE</text>
  <text x="760" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Technology should surface context.</text>
  <text x="760" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Clinical judgment remains human.</text>
</svg>