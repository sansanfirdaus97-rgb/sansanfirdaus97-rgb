<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0b1023"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect x="38" y="32" width="1124" height="2" fill="url(#accent)" filter="url(#glow)"/>
  <text x="52" y="70" font-family="monospace" font-size="15" letter-spacing="3" fill="#67e8f9">FROM.CLINIC.TO.CODE</text>
  <text x="52" y="97" font-family="monospace" font-size="12" fill="#64748b">veterinary practice → product architecture</text>

  <text x="70" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">I’m a veterinarian building software around problems encountered directly in active clinical practice.</text>
  <text x="70" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">My work sits at the intersection of:</text>

  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="70" y="205" width="190" height="40" rx="10" fill="#07111f" stroke="#164e63"/><text x="165" y="230" fill="#e2e8f0">Veterinary Medicine</text>
    <rect x="280" y="205" width="170" height="40" rx="10" fill="#07111f" stroke="#164e63"/><text x="365" y="230" fill="#e2e8f0">Clinical Systems</text>
    <rect x="470" y="205" width="190" height="40" rx="10" fill="#07111f" stroke="#312e81"/><text x="565" y="230" fill="#e2e8f0">Product Architecture</text>
    <rect x="680" y="205" width="190" height="40" rx="10" fill="#07111f" stroke="#312e81"/><text x="775" y="230" fill="#e2e8f0">Software Engineering</text>
    <rect x="890" y="205" width="190" height="40" rx="10" fill="#07111f" stroke="#7e22ce"/><text x="985" y="230" fill="#e2e8f0">Clinical Operations</text>
  </g>

  <rect x="70" y="270" width="1060" height="38" rx="9" fill="#081526" stroke="#1e293b"/>
  <text x="600" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Does this make the patient’s clinical story easier to understand, continue, and act on?</text>
</svg>